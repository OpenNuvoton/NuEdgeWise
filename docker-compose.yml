services:
  nuedgewise:
    image: nuedgewise:v1
    command: bash
    stdin_open: true  # `-i`
    tty: true         # `-t`
    restart: "no"
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - ../ML_KWS:/ML_KWS
      - ../ML_Image_Classification:/ML_Image_Classification
    privileged: true
    # Host networking exposes Jupyter's port 8888 directly; "ports" is ignored in this mode.
    network_mode: host
